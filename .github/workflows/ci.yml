name: ci
on: [push, pull_request]

# Four independent jobs, so they run side by side.
jobs:
  static:
    name: typecheck and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hotel/shared run build
      - run: pnpm --filter @hotel/migrate run typecheck
      - run: pnpm --filter @hotel/db run build
      - run: pnpm typecheck
      - run: pnpm lint

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  tests:
    name: tests and generated client
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: hotel, POSTGRES_PASSWORD: ci-db-password, POSTGRES_DB: hotel }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hotel" --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USER: hotel
      DB_PASSWORD: ci-db-password
      DB_NAME: hotel
      DATABASE_URL: postgresql://hotel:ci-db-password@localhost:5432/hotel
      REDIS_URL: redis://localhost:6379
      TEST_REDIS_BASE: redis://localhost:6379
      JWT_SECRET: ci-jwt-secret-at-least-32-characters-long
      CHANNEL_API_KEY: ci-channel-key
      CHANNEL_HMAC_SECRET: ci-channel-hmac
      SEED_BOOKINGS_PER_HOTEL: '2000'
      SEED_HISTORY_DAYS: '30'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hotel/shared run build
      - run: pnpm --filter @hotel/migrate run build
      - run: pnpm --filter @hotel/db run build
      - run: pnpm --filter @hotel/worker run build # the kill -9 test starts the real worker process
      - name: Migrate and seed the application database (small seed)
        run: pnpm --filter @hotel/migrate run migrate && pnpm --filter @hotel/migrate run seed
      - name: Generated API client is up to date
        run: pnpm gen:api && git diff --exit-code -- apps/web/openapi.json apps/web/src/shared/api/schema.d.ts
      - name: Unit and integration tests (they create and migrate their own database)
        run: pnpm test

  e2e:
    name: e2e (Playwright on the compose stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: The documented start, with a small seed
        run: |
          cp .env.example .env
          sed -i 's/^SEED_BOOKINGS_PER_HOTEL=.*/SEED_BOOKINGS_PER_HOTEL=2000/; s/^SEED_HISTORY_DAYS=.*/SEED_HISTORY_DAYS=30/' .env
          docker compose up --build -d
      - name: Wait for the stack
        run: |
          for i in $(seq 1 120); do
            curl -sf http://localhost:8088/api/health >/dev/null && curl -sf http://localhost:8088/ >/dev/null && curl -sf http://localhost:58025/api/v1/info >/dev/null && exit 0
            sleep 2
          done
          docker compose ps
          docker compose logs --tail=80
          exit 1
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hotel/shared run build
      - run: pnpm --filter @hotel/web exec playwright install --with-deps chromium
      - run: pnpm e2e
        env: { CI: 'true' }
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --tail=200
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: apps/web/test-results }
