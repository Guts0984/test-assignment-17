name: hotel-chain

x-app: &app
  image: hotel-chain-app:local
  env_file: .env
  restart: unless-stopped
  networks: [backend]

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports: ["127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [backend]

  redis:
    image: redis:7
    ports: ["127.0.0.1:${REDIS_HOST_PORT:-56379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [backend]

  migrate:
    <<: *app
    build: { context: ., target: app }
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
    working_dir: /app/infra/db
    command: ["sh", "-c", "node_modules/.bin/prisma migrate deploy && node dist/seed.js"]
    depends_on:
      postgres: { condition: service_healthy }

  api1:
    <<: *app
    command: ["node", "apps/api/dist/main.js"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck: &apihealth
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 40

  api2:
    <<: *app
    command: ["node", "apps/api/dist/main.js"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck: *apihealth

  mailpit:
    image: axllent/mailpit:v1.21
    ports: ["127.0.0.1:${MAILPIT_UI_PORT:-58025}:8025"]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [backend]

  worker:
    <<: *app
    command: ["node", "apps/worker/dist/main.js"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      mailpit: { condition: service_healthy }

  channel-stub:
    <<: *app
    command: ["node", "apps/channel-stub/dist/main.js"]
    ports: ["127.0.0.1:${CHANNEL_STUB_HOST_PORT:-54000}:4000"]
    depends_on:
      api1: { condition: service_healthy }

  web:
    build: { context: ., target: web }
    env_file: .env
    restart: unless-stopped
    networks: [backend]

  nginx:
    image: nginx:1.27
    volumes: ["./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    ports: ["${NGINX_PORT:-8088}:80"]
    depends_on:
      api1: { condition: service_healthy }
      api2: { condition: service_healthy }
      web: { condition: service_started }
    networks:
      backend:
        ipv4_address: ${NGINX_IP:-10.231.17.10}

networks:
  backend:
    ipam:
      config: [{ subnet: 10.231.17.0/24 }]

volumes:
  pgdata:
