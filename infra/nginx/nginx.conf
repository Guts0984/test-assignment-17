upstream api {
  server api1:3000;
  server api2:3000;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  client_max_body_size 200k;

  # errors produced by nginx itself use the same JSON format as the api
  error_page 400 = @bad_request;
  error_page 413 = @too_large;
  error_page 502 503 504 = @unavailable;
  location @bad_request  { default_type application/json; return 400 '{"code":"VALIDATION_ERROR","message":"The request could not be understood"}'; }
  location @too_large    { default_type application/json; return 413 '{"code":"PAYLOAD_TOO_LARGE","message":"Request body is too large"}'; }
  location @unavailable  { default_type application/json; return 503 '{"code":"INTERNAL","message":"The service is temporarily unavailable, please try again"}'; }

  # The only place that decides the client IP: always the TCP peer, never a client-supplied header.
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header Host $host;

  location /api/ {
    proxy_pass http://api;
    proxy_next_upstream error timeout;
  }

  location /docs {
    proxy_pass http://api;
  }

  location /socket.io/ {
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
  }

  location / {
    proxy_pass http://web:3001;
  }
}
